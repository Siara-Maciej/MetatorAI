        <animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;480;480;0" keyTimes="0;0.0667;0.3333;0.9333;1"/>
      </rect>
    </clipPath>
  <g><line class="gl v0" x1="40" y1="35" x2="40" y2="235"/><line class="gl h0" x1="40" y1="35" x2="240" y2="35"/><line class="gl v1" x1="73.33" y1="35" x2="73.33" y2="235"/><line class="gl h1" x1="40" y1="68.33" x2="240" y2="68.33"/><line class="gl v2" x1="106.67" y1="35" x2="106.67" y2="235"/><line class="gl h2" x1="40" y1="101.67" x2="240" y2="101.67"/><line class="gl v3" x1="140" y1="35" x2="140" y2="235"/><line class="gl h3" x1="40" y1="135" x2="240" y2="135"/><line class="gl v4" x1="173.33" y1="35" x2="173.33" y2="235"/><line class="gl h4" x1="40" y1="168.33" x2="240" y2="168.33"/><line class="gl v5" x1="206.67" y1="35" x2="206.67" y2="235"/><line class="gl h5" x1="40" y1="201.67" x2="240" y2="201.67"/><line class="gl v6" x1="240" y1="35" x2="240" y2="235"/><line class="gl h6" x1="40" y1="235" x2="240" y2="235"/></g>
  <g><rect class="u0" x="79.3" y="74.3" width="21.3" height="21.3" rx="4" fill="#f0b429" fill-opacity=".85"/><rect class="u1" x="146" y="74.3" width="21.3" height="21.3" rx="4" fill="#2dd4bf" fill-opacity=".85"/><rect class="u2" x="179.3" y="141" width="21.3" height="21.3" rx="4" fill="#a78bfa" fill-opacity=".85"/><rect class="u3" x="79.3" y="174.3" width="21.3" height="21.3" rx="4" fill="#2dd4bf" fill-opacity=".85"/><rect class="u4" x="212.7" y="74.3" width="21.3" height="21.3" rx="4" fill="#f0b429" fill-opacity=".85"/><rect class="u5" x="179.3" y="174.3" width="21.3" height="21.3" rx="4" fill="#f0b429" fill-opacity=".85"/><rect class="u6" x="212.7" y="207.7" width="21.3" height="21.3" rx="4" fill="#4ade80" fill-opacity=".85"/><rect class="u7" x="46" y="107.7" width="21.3" height="21.3" rx="4" fill="#a78bfa" fill-opacity=".85"/></g>
  
    <g class="groma" stroke="#e6edf3" stroke-width="2" fill="none" opacity=".9">
      <line x1="114" y1="135" x2="166" y2="135"/>
      <line x1="140" y1="109" x2="140" y2="161"/>
      <circle cx="140" cy="135" r="3.5" fill="#f0b429" stroke="none"/><line x1="114" y1="135" x2="114" y2="144" stroke-width="1"/><circle cx="114" cy="146" r="2.2" fill="#e6edf3" stroke="none"/><line x1="166" y1="135" x2="166" y2="144" stroke-width="1"/><circle cx="166" cy="146" r="2.2" fill="#e6edf3" stroke="none"/><line x1="140" y1="109" x2="140" y2="118" stroke-width="1"/><circle cx="140" cy="120" r="2.2" fill="#e6edf3" stroke="none"/><line x1="140" y1="161" x2="140" y2="170" stroke-width="1"/><circle cx="140" cy="172" r="2.2" fill="#e6edf3" stroke="none"/>
    </g>
  <text x="300" y="104" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" fill="url(#titleGrad)" font-weight="800" letter-spacing="-1.5">MetatorAI</text>
  <text x="300" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#e6edf3" font-weight="600" clip-path="url(#typeClip)">Lay out the ground. Then build.</text>
  <g opacity="0">
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.0667;0.3333;0.3556;1"/>
    <rect class="cursor" x="300" y="135" width="3" height="28" fill="#f0b429">
      <animate attributeName="x" dur="9s" repeatCount="indefinite" values="300;300;780;780;300" keyTimes="0;0.0667;0.3333;0.9333;1"/>
    </rect>
  </g>
  <text x="300" y="198" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e" >Agentic engineering for GitHub Copilot &amp; Claude Code.</text>
  <text x="300" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e" >Survey first. Prove everything.</text>
  <text x="300" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e" opacity=".8">survey · plan · gate · build · verify · ship</text>
</svg>
