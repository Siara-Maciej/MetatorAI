<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-label="MetatorAI: Lay out the ground. Then build.">
  <title>MetatorAI: Lay out the ground. Then build.</title>
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
