    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <style>@keyframes draw0 { 0%, 10.722% { stroke-dashoffset: 200; opacity: .9 } 12.222%, 91.111% { stroke-dashoffset: 0; opacity: 1 } 94.111%, 100% { stroke-dashoffset: 200; opacity: .9 } } .v0, .h0 { animation: draw0 9s ease-in-out infinite; } @keyframes draw1 { 0%, 12.722% { stroke-dashoffset: 200; opacity: .9 } 14.222%, 91.111% { stroke-dashoffset: 0; opacity: 1 } 94.111%, 100% { stroke-dashoffset: 200; opacity: .9 } } .v1, .h1 { animation: draw1 9s ease-in-out infinite; } @keyframes draw2 { 0%, 14.722% { stroke-dashoffset: 200; opacity: .9 } 16.222%, 91.111% { stroke-dashoffset: 0; opacity: 1 } 94.111%, 100% { stroke-dashoffset: 200; opacity: .9 } } .v2, .h2 { animation: draw2 9s ease-in-out infinite; } @keyframes draw3 { 0%, 16.722% { stroke-dashoffset: 200; opacity: .9 } 18.222%, 91.111% { stroke-dashoffset: 0; opacity: 1 } 94.111%, 100% { stroke-dashoffset: 200; opacity: .9 } } .v3, .h3 { animation: draw3 9s ease-in-out infinite; } @keyframes draw4 { 0%, 18.722% { stroke-dashoffset: 200; opacity: .9 } 20.222%, 91.111% { stroke-dashoffset: 0; opacity: 1 } 94.111%, 100% { stroke-dashoffset: 200; opacity: .9 } } .v4, .h4 { animation: draw4 9s ease-in-out infinite; } @keyframes draw5 { 0%, 20.722% { stroke-dashoffset: 200; opacity: .9 } 22.222%, 91.111% { stroke-dashoffset: 0; opacity: 1 } 94.111%, 100% { stroke-dashoffset: 200; opacity: .9 } } .v5, .h5 { animation: draw5 9s ease-in-out infinite; } @keyframes draw6 { 0%, 22.722% { stroke-dashoffset: 200; opacity: .9 } 24.222%, 91.111% { stroke-dashoffset: 0; opacity: 1 } 94.111%, 100% { stroke-dashoffset: 200; opacity: .9 } } .v6, .h6 { animation: draw6 9s ease-in-out infinite; } @keyframes unit0 { 0%, 27.389% { opacity: 0; transform: scale(.4) } 28.889%, 90% { opacity: 1; transform: scale(1) } 93%, 100% { opacity: 0; transform: scale(.4) } } .u0 { transform-box: fill-box; transform-origin: center; animation: unit0 9s ease-out infinite; } @keyframes unit1 { 0%, 30.944% { opacity: 0; transform: scale(.4) } 32.444%, 90% { opacity: 1; transform: scale(1) } 93%, 100% { opacity: 0; transform: scale(.4) } } .u1 { transform-box: fill-box; transform-origin: center; animation: unit1 9s ease-out infinite; } @keyframes unit2 { 0%, 34.5% { opacity: 0; transform: scale(.4) } 36%, 90% { opacity: 1; transform: scale(1) } 93%, 100% { opacity: 0; transform: scale(.4) } } .u2 { transform-box: fill-box; transform-origin: center; animation: unit2 9s ease-out infinite; } @keyframes unit3 { 0%, 38.056% { opacity: 0; transform: scale(.4) } 39.556%, 90% { opacity: 1; transform: scale(1) } 93%, 100% { opacity: 0; transform: scale(.4) } } .u3 { transform-box: fill-box; transform-origin: center; animation: unit3 9s ease-out infinite; } @keyframes unit4 { 0%, 41.611% { opacity: 0; transform: scale(.4) } 43.111%, 90% { opacity: 1; transform: scale(1) } 93%, 100% { opacity: 0; transform: scale(.4) } } .u4 { transform-box: fill-box; transform-origin: center; animation: unit4 9s ease-out infinite; } @keyframes unit5 { 0%, 45.167% { opacity: 0; transform: scale(.4) } 46.667%, 90% { opacity: 1; transform: scale(1) } 93%, 100% { opacity: 0; transform: scale(.4) } } .u5 { transform-box: fill-box; transform-origin: center; animation: unit5 9s ease-out infinite; } @keyframes unit6 { 0%, 48.722% { opacity: 0; transform: scale(.4) } 50.222%, 90% { opacity: 1; transform: scale(1) } 93%, 100% { opacity: 0; transform: scale(.4) } } .u6 { transform-box: fill-box; transform-origin: center; animation: unit6 9s ease-out infinite; } @keyframes unit7 { 0%, 52.278% { opacity: 0; transform: scale(.4) } 53.778%, 90% { opacity: 1; transform: scale(1) } 93%, 100% { opacity: 0; transform: scale(.4) } } .u7 { transform-box: fill-box; transform-origin: center; animation: unit7 9s ease-out infinite; } @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(90deg); } } .groma { transform-origin: 140px 135px; animation: spin 9s cubic-bezier(.7,0,.3,1) infinite; } @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } } .cursor { animation: blink 1s steps(1) infinite; } .gl { stroke: #30363d; stroke-width: 1.2; stroke-dasharray: 200; stroke-dashoffset: 200; }</style>
  <rect width="960" height="270" rx="18" fill="url(#bgGrad)" stroke="#30363d"/>
  
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b429"/><stop offset=".5" stop-color="#fde68a"/><stop offset="1" stop-color="#2dd4bf"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="typeClip">
