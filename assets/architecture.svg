<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Architecture: domain inside ports inside application inside runtime; CLI and hooks drive it, plugins implement ports">
  <title>MetatorAI architecture</title>
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <style>.flowin { stroke-dasharray: 4 6; animation: flowin 1.2s linear infinite; } @keyframes flowin { to { stroke-dashoffset: -20; } } @keyframes ly0 { 0%, 2.25% { stroke: #30363d; stroke-opacity: 1 } 3.75%, 16.25% { stroke: #8b949e; stroke-opacity: 1 } 19.25%, 100% { stroke: #30363d; stroke-opacity: 1 } } .ly0 { animation: ly0 8s linear infinite; } @keyframes ly1 { 0%, 11% { stroke: #30363d; stroke-opacity: 1 } 12.5%, 25% { stroke: #2dd4bf; stroke-opacity: 1 } 28%, 100% { stroke: #30363d; stroke-opacity: 1 } } .ly1 { animation: ly1 8s linear infinite; } @keyframes ly2 { 0%, 19.75% { stroke: #30363d; stroke-opacity: 1 } 21.25%, 33.75% { stroke: #a78bfa; stroke-opacity: 1 } 36.75%, 100% { stroke: #30363d; stroke-opacity: 1 } } .ly2 { animation: ly2 8s linear infinite; } @keyframes ly3 { 0%, 28.5% { stroke: #30363d; stroke-opacity: 1 } 30%, 42.5% { stroke: #f0b429; stroke-opacity: 1 } 45.5%, 100% { stroke: #30363d; stroke-opacity: 1 } } .ly3 { animation: ly3 8s linear infinite; } @keyframes dr0 { 0%, 1% { stroke: #30363d } 2.5%, 17.5% { stroke: #2dd4bf } 20.5%, 100% { stroke: #30363d } } .dr0 { animation: dr0 8s linear infinite; } @keyframes dr1 { 0%, 4.125% { stroke: #30363d } 5.625%, 20.625% { stroke: #2dd4bf } 23.625%, 100% { stroke: #30363d } } .dr1 { animation: dr1 8s linear infinite; } @keyframes dr2 { 0%, 7.25% { stroke: #30363d } 8.75%, 23.75% { stroke: #2dd4bf } 26.75%, 100% { stroke: #30363d } } .dr2 { animation: dr2 8s linear infinite; } @keyframes dn0 { 0%, 56% { stroke: #30363d } 57.5%, 77.5% { stroke: #a78bfa } 80.5%, 100% { stroke: #30363d } } .dn0 { animation: dn0 8s linear infinite; } @keyframes dn1 { 0%, 57.5% { stroke: #30363d } 59%, 77.5% { stroke: #a78bfa } 80.5%, 100% { stroke: #30363d } } .dn1 { animation: dn1 8s linear infinite; } @keyframes dn2 { 0%, 59% { stroke: #30363d } 60.5%, 77.5% { stroke: #a78bfa } 80.5%, 100% { stroke: #30363d } } .dn2 { animation: dn2 8s linear infinite; } @keyframes dn3 { 0%, 60.5% { stroke: #30363d } 62%, 77.5% { stroke: #a78bfa } 80.5%, 100% { stroke: #30363d } } .dn3 { animation: dn3 8s linear infinite; } @keyframes dn4 { 0%, 62% { stroke: #30363d } 63.5%, 77.5% { stroke: #a78bfa } 80.5%, 100% { stroke: #30363d } } .dn4 { animation: dn4 8s linear infinite; } @keyframes dn5 { 0%, 63.5% { stroke: #30363d } 65%, 77.5% { stroke: #a78bfa } 80.5%, 100% { stroke: #30363d } } .dn5 { animation: dn5 8s linear infinite; } @keyframes dn6 { 0%, 65% { stroke: #30363d } 66.5%, 77.5% { stroke: #a78bfa } 80.5%, 100% { stroke: #30363d } } .dn6 { animation: dn6 8s linear infinite; } @keyframes dn7 { 0%, 66.5% { stroke: #30363d } 68%, 77.5% { stroke: #a78bfa } 80.5%, 100% { stroke: #30363d } } .dn7 { animation: dn7 8s linear infinite; }</style>
