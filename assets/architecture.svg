      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1062;0.1125;0.3375;0.3563;1"/>
    </circle><path d="M172,271 C215,271 235,233 352,250" stroke="#30363d" stroke-width="1.2" fill="none"/><rect class="dr2" x="40" y="254" width="132" height="34" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="106" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3" text-anchor="middle">MCP (soon)</text>
    <circle r="4.5" fill="#2dd4bf" filter="url(#glow)" opacity="0" fill-opacity="1">
