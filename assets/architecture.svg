ans-serif" font-size="11" fill="#8b949e" text-anchor="end">pure TS · zero I/O</text><text x="480" y="258" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">Result · DependencyGraph · Diagnostic</text><text x="480" y="280" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">no node:*, no bun, no adapters</text><text x="40" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#f0b429" letter-spacing="1.5">DRIVING</text><path d="M172,147 C215,147 235,233 352,250" stroke="#30363d" stroke-width="1.2" fill="none"/><rect class="dr0" x="40" y="130" width="132" height="34" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="106" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e6edf3" text-anchor="middle">CLI</text>
