id: mt-arch-desktop-layers-features
language: TypeScript
severity: error
message: "ADR-0109: A feature imports shared/, ui/ and other features' files, never app/ (the shell composes the features)."
note: "The desktop app's layers point one way: app → features → shared → ui. Move the code to the layer that may know it, or pass it down as a prop."
files:
  - packages/desktop/src/features/**
rule:
  any:
    - all:
        - kind: import_statement
        - has: { field: source, regex: '^[''"](\.\./)+app/' }
    - all:
        - kind: export_statement
        - has: { field: source, regex: '^[''"](\.\./)+app/' }
    - all:
        - kind: call_expression
        - has: { field: function, kind: import }
        - has: { field: arguments, has: { kind: string, regex: '^[''"](\.\./)+app/' } }
