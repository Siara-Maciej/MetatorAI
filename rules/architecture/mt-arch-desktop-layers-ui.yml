id: mt-arch-desktop-layers-ui
language: TypeScript
severity: error
message: "ADR-0109: The design system (ui/) knows nothing of the app: no import of shared/, features/ or app/."
note: "The desktop app's layers point one way: app → features → shared → ui. Move the code to the layer that may know it, or pass it down as a prop."
files:
  - packages/desktop/src/ui/**
rule:
  any:
    - all:
        - kind: import_statement
        - has: { field: source, regex: '^[''"](\.\./)+(shared|features|app)/' }
    - all:
        - kind: export_statement
        - has: { field: source, regex: '^[''"](\.\./)+(shared|features|app)/' }
    - all:
        - kind: call_expression
        - has: { field: function, kind: import }
        - has: { field: arguments, has: { kind: string, regex: '^[''"](\.\./)+(shared|features|app)/' } }
