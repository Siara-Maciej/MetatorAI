kind: RuleSet
schemaVersion: 1
area: ARCH
description: Clean architecture boundaries of MetatorAI (ports and adapters, dependencies point inward).
rules:
  - id: MT-ARCH-001
    title: Domain code is pure
    applyTo: ["packages/core/src/domain/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-domain-pure
    summary: Domain modules import no I/O, no runtime APIs, no ports, no application code and no adapters.
    rationale: docs/ARCHITECTURE.md
    source: { ref: AGENTS.md#architecture-enforced, verified: 2026-10-26 }
  - id: MT-ARCH-002
    title: Core does not depend on infrastructure
    applyTo: ["packages/core/src/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-core-no-infra
    summary: Ports and application code never import the DI runtime, plugins or runtime APIs.
    rationale: docs/ARCHITECTURE.md
    source: { ref: AGENTS.md#architecture-enforced, verified: 2026-10-26 }
  - id: MT-ARCH-003
    title: Core imports only approved pure libraries
    applyTo: ["packages/core/src/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-core-approved-deps
    summary: "@metator/core imports only the libraries approved in ADR-0010 (neverthrow, graphlib, xstate, picomatch, zod, yaml, slugify, github-slugger, shell-quote, semver)."
    rationale: docs/adr/0010-dependency-policy.md
    source: { ref: AGENTS.md#rules-that-hold-everywhere, verified: 2026-10-26 }
  - id: MT-ARCH-004
    title: Core never touches the Bun global or process
    applyTo: ["packages/core/src/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-no-bun-global-in-core
    summary: Core runs on any runtime and in tests without I/O, so it never reads Bun or process.
    rationale: docs/ARCHITECTURE.md
    source: { ref: AGENTS.md#architecture-enforced, verified: 2026-10-26 }
  - id: MT-ARCH-005
    title: Plugins depend on core only
    applyTo: ["packages/plugin-*/src/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-plugins-isolated
    summary: A plugin imports @metator/core and its own libraries, never runtime, cli or another plugin.
    rationale: docs/ARCHITECTURE.md
    source: { ref: AGENTS.md#architecture-enforced, verified: 2026-10-26 }
  - id: MT-ARCH-006
    title: Use cases receive ports through the constructor
    applyTo: ["packages/core/src/application/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-006
    summary: An application service takes every collaborator (ports, other use cases) as a constructor parameter; it constructs only domain values and built-ins.
    rationale: docs/adr/0011-di-awilix.md
    source: { ref: AGENTS.md#architecture-enforced, verified: 2026-10-26 }
    do:
      - "constructor(private readonly vcs: Vcs, private readonly fs: ReadonlyFileSystem) {}"
    dont:
      - "const fs = new BunFileSystem(root); // inside a use case"
  - id: MT-ARCH-007
    title: Only the runtime knows concrete adapters
    applyTo: ["packages/runtime/src/**", "packages/cli/src/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-007
    summary: Concrete adapters are registered in packages/runtime/src/bootstrap.ts; CLI commands resolve use cases from the container.
    rationale: docs/adr/0011-di-awilix.md
    source: { ref: AGENTS.md#architecture-enforced, verified: 2026-10-26 }
    do:
      - 'await container().resolve("graphQueries").cycles()'
    dont:
      - "new GitVcs(root) inside a CLI command"
  - id: MT-ARCH-008
    title: Small ports split by axis of change
    applyTo: ["packages/core/src/ports/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-008
    summary: A port interface has at most five members; a bigger one is split by axis of change (readers from writers, one tool capability from another).
    rationale: docs/ARCHITECTURE.md
    source: { ref: AGENTS.md#rules-that-hold-everywhere, verified: 2026-10-26 }
  - id: MT-ARCH-009
    title: No import cycles, type-only ones included
    applyTo: ["packages/**/*.ts", "e2e/**/*.ts", "scripts/**/*.ts"]
    enforcement: E1
    implementation: test:mt-arch-009
    summary: No two files import each other, directly or through others; an `import type` is an edge too. `bun run arch` runs `metator graph cycles --check` and prints the cycle.
    rationale: docs/ARCHITECTURE.md
    source: { ref: AGENTS.md#architecture-enforced, verified: 2026-11-12 }
    do:
      - "declare the type both files need in a third file, or where it is used"
    dont:
      - 'a.ts: import type { B } from "./b.ts"; b.ts: import { a } from "./a.ts"'
  - id: MT-ARCH-010
    title: The desktop app takes only types from core
    applyTo: ["packages/desktop/src/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-desktop-type-imports
    summary: The desktop app imports from MetatorAI only types of @metator/core, with a whole-statement `import type`; no value, no other package, no re-export, no import().
    rationale: docs/adr/0085-desktop-type-imports-from-core.md
    source: { ref: docs/adr/0085-desktop-type-imports-from-core.md, verified: 2026-11-13 }
    do:
      - 'import type { RunOverview } from "@metator/core";'
    dont:
      - 'import { type RunOverview } from "@metator/core";'
      - 'import { briefOf } from "@metator/core";'
  - id: MT-ARCH-011
    title: The desktop design system knows nothing of the app
    applyTo: ["packages/desktop/src/ui/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-desktop-layers-ui
    summary: A file in the desktop app's ui/ imports React, ui/ and libraries only, never shared/, features/ or app/; the layers point one way, app → features → shared → ui.
    rationale: docs/adr/0109-desktop-feature-structure-and-compiler.md
    source: { ref: docs/adr/0109-desktop-feature-structure-and-compiler.md, verified: 2026-11-24 }
    do:
      - 'import { moveInList } from "./list-keys.ts";'
    dont:
      - 'import { useDaemon } from "../shared/daemon/daemon.tsx";'
  - id: MT-ARCH-012
    title: Desktop shared code imports no feature
    applyTo: ["packages/desktop/src/shared/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-desktop-layers-shared
    summary: A file in the desktop app's shared/ imports ui/ and shared/, never features/ or app/; what one feature needs from another it imports itself.
    rationale: docs/adr/0109-desktop-feature-structure-and-compiler.md
    source: { ref: docs/adr/0109-desktop-feature-structure-and-compiler.md, verified: 2026-11-24 }
    do:
      - 'import { Modal } from "../../ui/modal.tsx";'
    dont:
      - 'import { useHostEditor } from "../../features/repos/repos-context.tsx";'
  - id: MT-ARCH-013
    title: A desktop feature does not import the shell
    applyTo: ["packages/desktop/src/features/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-desktop-layers-features
    summary: A file in features/ imports shared/, ui/ and other features' files, never app/; the shell (app/) composes the features and passes what they need as props.
    rationale: docs/adr/0109-desktop-feature-structure-and-compiler.md
    source: { ref: docs/adr/0109-desktop-feature-structure-and-compiler.md, verified: 2026-11-24 }
    do:
      - 'import { Answer } from "../inbox/answer.tsx";'
    dont:
      - 'import { NoDaemon } from "../../app/no-daemon.tsx";'
  - id: MT-ARCH-014
    title: A desktop button is the design system's Button
    applyTo: ["packages/desktop/src/app/**", "packages/desktop/src/features/**", "packages/desktop/src/shared/**"]
    enforcement: E1
    implementation: ast-grep:mt-arch-desktop-ui-button
    summary: Outside ui/, the desktop app draws no raw <button>; every button is <Button> from ui/button.tsx, with a variant for its look and `type` button by default.
    rationale: docs/adr/0111-desktop-design-system.md
    source: { ref: docs/adr/0111-desktop-design-system.md, verified: 2026-11-24 }
    do:
      - '<Button variant="primary" onClick={go}>Start</Button>'
    dont:
      - '<button type="button" className="primary" onClick={go}>Start</button>'
