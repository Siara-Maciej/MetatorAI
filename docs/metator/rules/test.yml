kind: RuleSet
schemaVersion: 1
area: TEST
description: How MetatorAI proves that work actually works.
rules:
  - id: MT-TEST-001
    title: Every user-facing change has an e2e test on the real CLI
    applyTo: ["packages/cli/src/**", "packages/runtime/src/**"]
    enforcement: E2
    summary: A new or changed command comes with an e2e test that runs the metator process against real files in a temporary git repository.
    rationale: docs/ARCHITECTURE.md
    source: { ref: AGENTS.md#testing-policy-prove-every-piece-of-work-actually-works, verified: 2026-10-25 }
    do:
      - 'const r = await metator(["rules", "lint"], repo.root)'
  - id: MT-TEST-002
    title: Every port adapter passes its contract suite
    applyTo: ["packages/plugin-*/src/**"]
    enforcement: E2
    summary: An adapter for a port that has a contract suite in packages/testing/src/contracts calls that suite from its own test.
    rationale: docs/ARCHITECTURE.md
    source: { ref: AGENTS.md#testing-policy-prove-every-piece-of-work-actually-works, verified: 2026-10-25 }
  - id: MT-TEST-003
    title: Bugs get a failing test first
    applyTo: ["packages/**"]
    enforcement: E3
    summary: Reproduce a bug with a failing test, then fix it; add a mutant to scripts/mutation-smoke.ts for critical behavior.
    rationale: docs/ARCHITECTURE.md
    source: { ref: AGENTS.md#testing-policy-prove-every-piece-of-work-actually-works, verified: 2026-10-25 }
