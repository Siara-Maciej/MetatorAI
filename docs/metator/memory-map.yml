kind: MemoryMap
schemaVersion: 1
# Every knowledge carrier MetatorAI's own agents use (ADR-0021). `bun run canon` runs `metator memory check`.
knowledge:
  include:
    - "**/AGENTS.md"
    - "**/CLAUDE.md"
    - ".github/instructions/**"
    - ".github/metator/**"
    - "docs/**"
    - "metator/agents/**"
    - ".github/agents/**"
    - ".claude/agents/**"
    - "metator/skills/**"
    - ".github/skills/**"
    - ".claude/skills/**"
tierBudgets:
  T0: { chars: 4000 }
items:
  - id: t0.agents
    tier: T0
    kind: canon
    paths: ["AGENTS.md", "CLAUDE.md"]
    load: always
    writers: [human]
    readers: ["*"]
    budget: { chars: 4000, lines: 80 }
    description: Always-loaded project instructions (CLAUDE.md imports AGENTS.md).
  - id: t1.package-agents
    tier: T1
    kind: canon
    paths: ["packages/*/AGENTS.md"]
    load: "applyTo:packages/**"
    writers: [human]
    readers: ["*"]
    budget: { chars: 1500, lines: 25 }
    description: Package instructions, read before working in that package (root AGENTS.md says so).
  - id: t1.adr
    tier: T1
    kind: canon
    paths: ["docs/adr/*.md"]
    load: explicit
    writers: [human, "agents (Proposed only)"]
    readers: ["*"]
  - id: t1.design
    tier: T1
    kind: canon
    paths: ["docs/*.md", "docs/design/*.md"]
    load: explicit
    writers: [human]
    readers: ["*"]
  - id: t1.rules
    tier: T1
    kind: canon
    paths: ["docs/metator/rules/*.yml"]
    load: "query:metator rules pack --paths <files>"
    writers: [human]
    readers: ["*"]
  - id: t1.dependencies
    tier: T1
    kind: canon
    paths: ["docs/metator/dependencies.yml"]
    load: explicit
    writers: [human]
    readers: ["*"]
    description: Approved third-party packages with their need and ADR (MT-CODE-005).
  - id: t1.schemas
    tier: T1
    kind: derived
    paths: ["docs/metator/schemas/*.json"]
    load: explicit
    writers: ["bun run schemas:freeze"]
    readers: ["*"]
    description: Frozen JSON Schema of every released document version, with migration examples (MT-CODE-003).
  - id: t1.memory-map
    tier: T1
    kind: canon
    paths: ["docs/metator/memory-map.yml"]
    load: explicit
    writers: [human]
    readers: ["*"]
  - id: t1.module-cards
    tier: T1
    kind: canon
    paths: ["docs/metator/modules/*.card.md"]
    load: explicit
    writers: ["metator cards build (generated block)", human]
    readers: ["*"]
    budget: { lines: 60 }
    description: One card per package; facts are generated, responsibility, invariants and pitfalls are curated.
  - id: t1.patterns
    tier: T1
    kind: canon
    paths: ["docs/metator/patterns/**"]
    load: "query:metator similar --file <planned file>"
    writers: [human]
    readers: ["*"]
    description: Pattern catalog with ast-grep detection rules (severity hint) and their tests.
  - id: t1.agents
    tier: T1
    kind: canon
    paths: ["metator/agents/*.md", "metator/agents/partials/*.md"]
    load: explicit
    writers: [human]
    readers: ["*"]
    budget: { lines: 220 }
    description: Canonical, host-neutral agents; `metator generate` writes the host files.
  - id: t1.skills
    tier: T1
    kind: canon
    paths: ["metator/skills/**"]
    load: "skill:mt-*"
    writers: [human]
    readers: [copilot, claude]
    description: Canonical skills (SKILL.md with its scripts); hosts load one when its description matches the task.
  - id: t1.workflows
    tier: T1
    kind: canon
    paths: [".github/metator/workflows/*.yml"]
    load: "query:metator run status"
    writers: [human]
    readers: [mt-orchestrator, mt-pr-review, "metator run"]
    description: Workflow specs (W1-W5) that `metator run` executes as state machines and `workflow lint` checks against the anatomy.
  - id: t1.host-skills
    tier: T1
    kind: derived
    paths: [".github/skills/**", ".claude/skills/**"]
    load: "skill:mt-*"
    writers: ["metator generate"]
    readers: [copilot, claude]
  - id: t1.host-agents
    tier: T1
    kind: derived
    paths: [".github/agents/*.agent.md", ".claude/agents/*.md"]
    load: explicit
    writers: ["metator generate"]
    readers: [copilot, claude]
  - id: t1.instructions
    tier: T1
    kind: derived
    paths: [".github/instructions/mt-*.instructions.md"]
    load: "applyTo:<rule globs>"
    writers: ["metator rules adapters"]
    readers: [copilot]
    budget: { lines: 150 }
  - id: t2.import-index
    tier: T2
    kind: derived
    paths: [".metator/index/**"]
    load: "query:metator graph"
    writers: ["metator index build"]
    readers: ["*"]
  - id: t3.runs
    tier: T3
    kind: working
    paths: [".metator/runs/**"]
    load: explicit
    writers: ["metator run"]
    readers: ["*"]
  - id: t4.lessons
    tier: T4
    kind: learned
    paths: ["docs/metator/lessons/*.md"]
    load: explicit
    writers: ["mt-retro (after human approval, via metator lessons add)"]
    readers: [mt-planner, mt-implementer, mt-review-logic]
    description: Lessons learned from runs; each cites code that `memory validate` keeps true.
  - id: t1.claims
    tier: T1
    kind: canon
    paths: ["docs/metator/claims.json"]
    load: "query:metator docs drift"
    writers: ["mt-docs-curator (after human approval)"]
    readers: [mt-docs-curator, "metator docs drift"]
    description: Claims from docs and ADRs verified against the code; `docs drift` re-checks their evidence.
  - id: t1.system
    tier: T1
    kind: canon
    paths: ["docs/metator/system.yml"]
    load: "query:metator system show"
    writers: [human, "metator system discover (proposal, after approval)"]
    readers: [mt-system-scout, mt-system-planner, "metator system"]
    description: The system map (applications, contracts, policies); `system lint` keeps it true.
