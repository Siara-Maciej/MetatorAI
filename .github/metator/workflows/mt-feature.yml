# W1: implement a feature (docs/design/02-workflows.md §3).
kind: Workflow
schemaVersion: 2
id: mt-feature
revision: 2
description: Survey, plan, gate, build, verify, ship
entry: { prompt: mt-feature }
input:
  oneOf: [task_ref, task_text]
  optional: [autonomy]
preconditions: [clean-tree, index-fresh, branch-ok]
limits: { parallel: 6 }
stages:
  - id: setup
    description: Branch and preconditions (clean tree, fresh index)
    owner: "script:metator index build"
  - id: intake
    description: Task and acceptance criteria; ask when ambiguous
    owner: [mt-orchestrator, skill:mt-grill]
    produces: [task.md]
  - id: context
    description: Parallel subagents survey the code (graph, patterns, rules)
    parallel: [mt-scout, mt-pattern-miner, mt-rule-curator]
    produces: [analysis.json, research.json, rulepack.md]
  - id: plan
    description: Steps with files, tests first and an exemplar per step
    owner: mt-planner
    produces: [plan.json, plan-scope.json]
  - id: plan-gate
    description: Deterministic plan lint, then an independent plan critic
    owner: "script:metator plan lint {runDir}/plan.json"
    gate: { script: "metator plan lint {runDir}/plan.json", llm: mt-plan-critic }
    onFail: { goto: plan, loop: plan }
  - id: plan-approval
    description: The human approves the plan
    hitl: true
    skipAt: [L1]
  - id: build
    description: Tests RED then GREEN, edits only inside the plan scope
    owner: [mt-test-author, mt-implementer, skill:mt-create-from-pattern]
    produces: [build-log.md]
  - id: gates
    description: Lint, typecheck, rules, affected tests, graph and API diff
    owner: mt-gatekeeper
    produces: [gates.json]
    gate: { script: metator gate full }
    onFail: { goto: build, loop: build }
  - id: review
    description: Find in parallel, verify by refutation, judge (mt-review-core)
    owner: mt-pr-review
    produces: [verdict.json]
    gate: { llm: mt-judge }
    onFail: { goto: plan, loop: review }
  - id: delivery
    description: The human approves the push and the PR
    hitl: true
    neverSkip: true
  - id: publish
    description: Push and open the PR after approval
    owner: mt-pr-author
    produces: [pr.md]
  - id: learn
    description: Lessons from the run
    owner: mt-retro
    optional: true
loops: { plan: 2, build: 2, review: 3 }
escalation:
  onLoopExhausted: report open issues with options (continue, manual, abort)
  onAmbiguity: stop and ask (skill mt-grill)
autonomy: [L0, L1]
permissions: { edit: plan-scope, external: [push, comment] }
done: [gates.json passes, verdict.json decision is APPROVED, push approved]
recovery: [failed gate runs skill mt-diagnose, retry a tool once, then escalate]
resume: metator run status, then continue at the last approved stage
telemetry: [stage_duration, tokens, loops, escalations, outcome]
report: summary with links to plan.json, gates.json, verdict.json and the PR
