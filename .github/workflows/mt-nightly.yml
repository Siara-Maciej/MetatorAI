name: mt-nightly

# W10 knowledge refresh (F5): every night the generated knowledge is rebuilt (the index, the module
# cards, the pattern catalog, the host files, the rule adapters, citations whose lines moved) and
# checked for drift. What changed becomes one pull request; what drifted (claims the code no longer
# backs, rules no tool enforces) becomes one issue, updated in place.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Rebuild the generated knowledge
        run: |
          set -e
          bun run metator index build
          bun run metator cards build
          bun run metator patterns scan
          bun run metator memory validate --fix
          bun run metator generate
          bun run metator rules adapters
      - name: Drift and coverage
        id: drift
        run: |
          bun run metator docs drift > drift.json || true
          bun run metator rules coverage > coverage.json || true
          bun run metator memory check > memory.json || true
          bun -e '
            const read = (f) => { try { return JSON.parse(require("node:fs").readFileSync(f, "utf8")); } catch { return undefined; } };
            const drift = read("drift.json"), coverage = read("coverage.json"), memory = read("memory.json");
            const lines = [];
            for (const r of drift?.data?.results ?? []) if (r.status !== "ok") lines.push(`- claim \`${r.id}\` in \`${r.source}\`: ${r.status}${r.cites ? ` (cites ${r.cites})` : ""}`);
            for (const r of coverage?.data?.uncovered ?? coverage?.data?.rules?.filter?.((x) => x.enforcement !== "E1") ?? []) lines.push(`- rule \`${r.id ?? r}\` has no tool behind it`);
            for (const p of memory?.data?.problems ?? []) if (p.severity === "error") lines.push(`- memory map: ${p.item}: ${p.message}`);
            require("node:fs").writeFileSync("drift.md", lines.join("\n"));
            console.log(lines.length ? `${lines.length} drift line(s)` : "no drift");
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `count=${lines.length}\n`);
          '
          rm -f drift.json coverage.json memory.json
      - name: Pull request with the regenerated knowledge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "metator-nightly"
          git config user.email "metator-nightly@users.noreply.github.com"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then echo "nothing regenerated"; exit 0; fi
          branch="metator/knowledge-refresh"
          git checkout -B "$branch"
          git add -A
          git reset -q drift.md || true
          git commit -qm "Knowledge refresh: regenerated index, cards, patterns, host files and adapters (nightly W10)"
          git push -f origin "$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "the refresh PR exists; its branch was updated"
          else
            gh pr create --base "${GITHUB_REF_NAME:-main}" --head "$branch" --title "Knowledge refresh (nightly)" \
              --body "Regenerated by \`mt-nightly\`: \`metator index build\`, \`cards build\`, \`patterns scan\`, \`memory validate --fix\`, \`generate\`, \`rules adapters\`. Review the diff; nothing here was written by hand."
          fi
      - name: Issue with the drift
        if: steps.drift.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          title="Knowledge drift (nightly)"
          body="$(printf 'Found by `mt-nightly` on %s:\n\n%s\n\nFix the code, the claim or the rule; `metator docs drift`, `metator rules coverage` and `metator memory check` show the same locally.' "$(date -u +%Y-%m-%d)" "$(cat drift.md)")"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then gh issue edit "$number" --body "$body"; else gh issue create --title "$title" --body "$body" --label documentation || gh issue create --title "$title" --body "$body"; fi
