name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Lint and format
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Architecture rules (ast-grep)
        run: bun run arch
      - name: Rule canon (lint + generated instructions up to date)
        run: bun run canon
      - name: Browser and fonts for visual e2e
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation fonts-freefont-ttf
          bunx playwright install --with-deps chromium
      - name: Unit tests
        run: bun run test:unit
      - name: E2E tests (CLI process, README visuals in Chromium)
        run: bun run test:e2e
      - name: Mutation smoke (tests must catch injected bugs)
        run: bun run test:mutation
