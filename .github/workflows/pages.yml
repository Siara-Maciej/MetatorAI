name: docs

# Builds the user documentation (site/, VitePress) on every change and publishes it to GitHub Pages
# from the branches below. One-time setup: Settings → Pages → Source: GitHub Actions. Until Pages is
# enabled, the site is still built and checked; only the publishing is skipped.
on:
  push:
    branches: [main, claude/foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" dates come from git history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: CLI reference matches the CLI
        run: bun scripts/site/cli-reference.ts --check
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        continue-on-error: true # Pages not enabled yet: build and check only
      - name: Build (fails on dead links)
        run: bun run site:build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/MetatorAI/' }}
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    # The github-pages environment deploys from the default branch only; other branches build and check.
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
