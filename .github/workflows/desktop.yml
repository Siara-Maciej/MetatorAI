name: desktop

# Builds the MetatorAI Desktop installers (Tauri) for Windows, macOS (universal) and Linux.
# Every run keeps them as workflow artifacts (Actions → the run → Artifacts). Once every platform
# has built, the `release` job puts them on the repository's Releases page:
# - a push to main (or a manual run on main) replaces the pre-release "desktop-latest", the latest build of main;
# - a tag `desktop-v*` publishes a release of that version.
# Pull requests only build.
on:
  push:
    branches: [main, claude/foundation]
    tags: ["desktop-v*"]
    paths:
      - packages/desktop/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - packages/desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: ""
          # One universal .dmg for Apple Silicon and Intel, built on the current macOS runner
          # (the Intel runners are retired, so the x64 half is cross-compiled).
          - os: macos-latest
            name: macos-universal
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            name: linux-x64
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - name: Linux webview and bundling libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          args: ${{ matrix.args }}
      - name: Keep the installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metatorai-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            packages/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage

  # Every platform's installers on one release, so a release is never missing a platform.
  release:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: metatorai-desktop-*
          path: installers
          merge-multiple: true
      - name: Collect the installer files
        run: |
          mkdir -p upload
          find installers -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} upload/ \;
          ls -l upload
          test -n "$(ls upload)"
      - name: Publish on Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          notes="Installers for Windows (.exe, .msi), macOS (.dmg, Apple Silicon and Intel) and Linux (.deb, .AppImage), built from ${SHA}. The app needs the metator command and \`metator serve\` running: see https://siara-maciej.github.io/MetatorAI/guide/desktop-app"
          if [[ "$REF" == refs/tags/desktop-v* ]]; then
            gh release create "$REF_NAME" upload/* --verify-tag --title "MetatorAI Desktop ${REF_NAME#desktop-}" --notes "$notes"
          else
            # The latest build of main: the pre-release and its tag move to this commit.
            gh release delete desktop-latest --yes --cleanup-tag || true
            gh release create desktop-latest upload/* --target "$SHA" --prerelease \
              --title "MetatorAI Desktop (latest build of main)" --notes "$notes"
          fi
