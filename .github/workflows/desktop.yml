name: desktop

# Builds the MetatorAI Desktop installers (Tauri) for Windows and macOS, and Linux for
# completeness. Every push to the main branches and every pull request that touches the app
# leaves the installers as workflow artifacts (Actions → the run → Artifacts); a tag `desktop-v*`
# publishes them on a GitHub Release.
on:
  push:
    branches: [main, claude/foundation]
    tags: ["desktop-v*"]
    paths:
      - packages/desktop/**
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - packages/desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: ""
          - os: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin
          - os: macos-13
            name: macos-x64
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            name: linux-x64
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || matrix.os == 'macos-13' && 'x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - name: Linux webview and bundling libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          args: ${{ matrix.args }}
          # A tag publishes a release with every platform's installer; otherwise only the artifacts below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('MetatorAI Desktop {0}', github.ref_name) || '' }}
          releaseBody: "Installers for Windows (.exe, .msi), macOS (.dmg) and Linux (.deb, .AppImage). The app needs `metator serve` running locally."
          releaseDraft: true
          prerelease: true
      - name: Keep the installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metatorai-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            packages/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
