kind: MetatorConfig
schemaVersion: 2
# MetatorAI on itself (ADR-0029). `bun run metator config show` prints the resolved values.
project:
  # The defaults, plus the e2e fixtures: sample repositories the tests copy (the Java shop has
  # entity cycles on purpose), not this repository's code.
  sourceIgnores:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/coverage/**"
    - ".metator/**"
    - "**/*.d.ts"
    - "e2e/fixtures/**"
gates:
  quick:
    - id: lint
      run: { bin: biome, args: [check, --files-ignore-unknown=true, --no-errors-on-unmatched] }
      files: append
    - id: rules
      run: { metator: rules check }
    - id: typecheck
      run: { script: typecheck }
  full:
    - id: lint
      run: { script: lint }
    - id: typecheck
      run: { script: typecheck }
    - id: arch
      run: { script: arch }
    - id: canon
      run: { script: canon }
    - id: test
      run: { script: test }
    - id: graph
      run: { metator: graph diff }
    - id: packages
      run: { metator: arch check }
hosts:
  metatorCommand: bun run metator
