[package]
name = "metator-desktop"
version = "0.0.0"
description = "MetatorAI Desktop: a thin client over `metator serve`"
edition = "2021"
publish = false

[lib]
name = "metator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
